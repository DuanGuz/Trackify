{% extends "core/base.html" %}
{% load static %}

{% block content %}
<div class="container-fluid">
  <div class="row mb-3">
    <div class="col">
      <h2>Dashboard con Filtros</h2>
      <p class="text-muted mb-0">Genera gráficos dinámicos por departamento, fechas y orden (mejores/peores).</p>
    </div>
  </div>

  <!-- Filtros -->
  <div class="card mb-3">
    <div class="card-body">
      <form id="filtrosForm" class="form-row">
        <div class="form-group col-md-3">
          <label>Departamento</label>
          <select id="f_depto" class="form-control">
            <option value="">(Todos)</option>
            {% for d in departamentos %}
              <option value="{{ d.id }}">{{ d.nombre }}</option>
            {% endfor %}
          </select>
        </div>

        <div class="form-group col-md-2">
          <label>Tipo evaluado</label>
          <select id="f_tipo" class="form-control">
            <option value="">(Todos)</option>
            <option value="TRABAJADOR">Trabajador</option>
            <option value="SUPERVISOR">Supervisor</option>
          </select>
        </div>

        <div class="form-group col-md-2">
          <label>Orden</label>
          <select id="f_order" class="form-control">
            <option value="desc">Mejores</option>
            <option value="asc">Peores</option>
          </select>
        </div>

        <div class="form-group col-md-1">
          <label>Top N</label>
          <input id="f_limit" type="number" min="1" max="50" value="5" class="form-control">
        </div>

        <div class="form-group col-md-2">
          <label>Desde</label>
          <input id="f_desde" type="date" class="form-control">
        </div>
        <div class="form-group col-md-2">
          <label>Hasta</label>
          <input id="f_hasta" type="date" class="form-control">
        </div>

        <div class="col-md-12 mt-2">
          <button type="button" id="btn_aplicar" class="btn btn-primary">Aplicar filtros</button>
          <button type="button" id="btn_limpiar" class="btn btn-light">Limpiar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Gráfico: Top evaluados -->
  <div class="card mb-3">
    <div class="card-header d-flex align-items-center justify-content-between">
      <div>Top evaluados (dinámico)</div>
    </div>
    <div class="card-body">

      <!-- 🔹 Botón de exportación CSV -->
      <a id="btn_export_top" class="btn btn-outline-secondary btn-sm mb-2">Exportar CSV</a>

      <div class="chart-container" style="position:relative; height:300px;">
        <canvas id="chartTop"></canvas>
      </div>

      <div class="table-responsive mt-3">
        <table class="table table-sm table-striped mb-0" id="tablaTop">
          <thead>
            <tr>
              <th>#</th><th>Nombre</th><th>Rol</th><th>Promedio</th><th>Evaluaciones</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>

    </div>
  </div>

  <!-- Gráfico: Tareas -->
  <div class="card-body">
  <div class="chart-container" style="position:relative; height:300px;">
    <canvas id="chartEstados"></canvas>
  </div>
</div>

  <div class="card-body">
  <div class="chart-container" style="position:relative; height:350px;">
    <canvas id="chartStacked"></canvas>
  </div>
</div>

</div>
{% endblock %}

{% block js %}
<script src="{% static 'core/js/chart.min.js' %}"></script>
<script>
(function(){
  const $  = (sel) => document.querySelector(sel);
  const qs = (sel) => document.querySelectorAll(sel);

  const fDepto = $("#f_depto");
  const fTipo  = $("#f_tipo");
  const fOrder = $("#f_order");
  const fLimit = $("#f_limit");
  const fDesde = $("#f_desde");
  const fHasta = $("#f_hasta");

  // ======= PALETA Y COLORES CONSISTENTES =======
  const PALETTE = [
    "#4e79a7","#f28e2c","#e15759","#76b7b2","#59a14f",
    "#edc948","#b07aa1","#ff9da7","#9c755f","#bab0ab"
  ];

  function colorByEstado(label) {
    switch ((label || "").toLowerCase()) {
      case "pendiente":   return "#edc948"; // amarillo
      case "en progreso": return "#4e79a7"; // azul
      case "atrasada":    return "#e15759"; // rojo
      case "finalizada":  return "#59a14f"; // verde
      default:            return "#bab0ab"; // gris
    }
  }

  function integerTicks() {
    return {
      beginAtZero: true,
      ticks: {
        stepSize: 1,
        callback: function(value) {
          return Number.isInteger(value) ? value : null;
        }
      }
    }
  }

  let chartTop, chartEstados, chartStacked;

  function params() {
    const p = new URLSearchParams();
    if (fDepto.value) p.set("depto", fDepto.value);
    if (fTipo.value)  p.set("tipo", fTipo.value);
    if (fOrder.value) p.set("order", fOrder.value);
    if (fLimit.value) p.set("limit", fLimit.value);
    if (fDesde.value) p.set("desde", fDesde.value);
    if (fHasta.value) p.set("hasta", fHasta.value);
    return p.toString();
  }

  async function fetchJSON(url) {
    const res = await fetch(url, {headers: {"X-Requested-With": "XMLHttpRequest"}});
    if (!res.ok) throw new Error("Error al cargar datos");
    return await res.json();
  }

  function renderTablaTop(items){
    const tbody = $("#tablaTop tbody");
    tbody.innerHTML = "";
    items.forEach((it, idx) => {
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>${idx+1}</td>
        <td>${it.nombre}</td>
        <td>${it.rol}</td>
        <td>${it.promedio.toFixed(2)}</td>
        <td>${it.total}</td>
      `;
      tbody.appendChild(tr);
    });
  }

  // ====== TOP EVALUADOS (barras horizontales o verticales) ======
  function updateChartTop(items){
    const labels = items.map(x => x.nombre);
    const data   = items.map(x => x.promedio);

    if (chartTop) chartTop.destroy();
    const ctx = document.getElementById("chartTop").getContext("2d");
    chartTop = new Chart(ctx, {
      type: "bar",
      data: {
        labels,
        datasets: [{
          label: "Promedio",
          data,
          backgroundColor: labels.map((_, i) => PALETTE[i % PALETTE.length])
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        indexAxis: "y", // queda similar a los tops del otro dashboard
        scales: {
          x: { beginAtZero: true, suggestedMax: 5 },
          y: { type: "category" }
        }
      }
    });
  }

  // ====== TAREAS POR ESTADO (doughnut con colores por estado) ======
  function updateChartEstados(items){
    const labels = items.map(x => x.estado);
    const data   = items.map(x => x.total);

    if (chartEstados) chartEstados.destroy();
    const ctx = document.getElementById("chartEstados").getContext("2d");
    chartEstados = new Chart(ctx, {
      type: "doughnut",
      data: {
        labels,
        datasets: [{
          label: "Tareas",
          data,
          backgroundColor: labels.map(colorByEstado),
          borderColor: "#ffffff",
          borderWidth: 1
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { position: "bottom" }
        }
      }
    });
  }

  // ====== TAREAS POR ESTADO Y DEPARTAMENTO (stacked bar con mismos colores) ======
  function updateChartStacked(items){
    const labels = items.map(x => x.departamento);
    const pend   = items.map(x => x.pendiente);
    const prog   = items.map(x => x.en_progreso);
    const atras  = items.map(x => x.atrasada);
    const fin    = items.map(x => x.finalizada);

    if (chartStacked) chartStacked.destroy();
    const ctx = document.getElementById("chartStacked").getContext("2d");
    chartStacked = new Chart(ctx, {
      type: "bar",
      data: {
        labels,
        datasets: [
          { label: "Pendiente",   data: pend,  backgroundColor: colorByEstado("Pendiente")   },
          { label: "En progreso", data: prog,  backgroundColor: colorByEstado("En progreso") },
          { label: "Atrasada",    data: atras, backgroundColor: colorByEstado("Atrasada")    },
          { label: "Finalizada",  data: fin,   backgroundColor: colorByEstado("Finalizada")  }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        scales: {
          x: { stacked: true },
          y: { stacked: true, ...integerTicks() }
        }
      }
    });
  }

  async function cargar(){
    const p = params();
    try {
      const top = await fetchJSON("{% url 'api_top_evaluados' %}" + (p ? ("?"+p) : ""));
      updateChartTop(top.items);
      renderTablaTop(top.items);

      const est = await fetchJSON("{% url 'api_tareas_por_estado' %}" + (p ? ("?"+p) : ""));
      updateChartEstados(est.items);

      const stk = await fetchJSON("{% url 'api_tareas_estado_por_depto' %}" + (p ? ("?"+p) : ""));
      updateChartStacked(stk.items);
    } catch (e) {
      console.error(e);
      alert("No se pudieron cargar los datos del dashboard.");
    }
  }

  $("#btn_aplicar").addEventListener("click", cargar);
  $("#btn_limpiar").addEventListener("click", () => {
    fDepto.value = ""; fTipo.value = ""; fOrder.value = "desc";
    fLimit.value = 5; fDesde.value = ""; fHasta.value = "";
    cargar();
  });

  // Exportar CSV del top usando los mismos filtros
  document.getElementById("btn_export_top").addEventListener("click", () => {
    const p = params();
    const url = "{% url 'api_top_evaluados_csv' %}" + (p ? ("?"+p) : "");
    window.location.href = url;
  });

  // Carga inicial
  cargar();
})();
</script>
{% endblock %}
